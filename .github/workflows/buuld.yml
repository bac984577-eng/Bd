package app.qalami

import com.google.mlkit.common.model.DownloadConditions
import com.google.mlkit.common.model.RemoteModelManager
import com.google.mlkit.vision.digitalink.*

/** Wraps ML Kit Digital Ink (Arabic). The model downloads once, then works offline. */
object Recognizer {
    private val modelId = DigitalInkRecognitionModelIdentifier.fromLanguageTag("ar")!!
    private val model = DigitalInkRecognitionModel.builder(modelId).build()
    private val recognizer: DigitalInkRecognizer by lazy {
        DigitalInkRecognition.getClient(DigitalInkRecognizerOptions.builder(model).build())
    }

    fun ensureModel(onState: (String) -> Unit) {
        val mgr = RemoteModelManager.getInstance()
        mgr.isModelDownloaded(model).addOnSuccessListener { ok ->
            if (ok) { onState("ready"); return@addOnSuccessListener }
            onState("downloading")
            mgr.download(model, DownloadConditions.Builder().build())
                .addOnSuccessListener { onState("ready") }
                .addOnFailureListener { onState("failed") }
        }.addOnFailureListener { onState("failed") }
    }

    fun recognize(ink: Ink, w: Float, h: Float, preContext: String,
                  onResult: (List<String>) -> Unit, onError: () -> Unit) {
        val ctx = RecognitionContext.builder()
            .setPreContext(preContext.takeLast(20))
            .setWritingArea(WritingArea(w, h))
            .build()
        recognizer.recognize(ink, ctx)
            .addOnSuccessListener { r -> onResult(r.candidates.map { it.text }.filter { it.isNotBlank() }) }
            .addOnFailureListener { onError() }
    }
}

