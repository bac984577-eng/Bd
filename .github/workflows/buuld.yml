package app.qalami

import android.app.Activity
import android.content.Intent
import android.graphics.Typeface
import android.os.Bundle
import android.provider.Settings
import android.view.Gravity
import android.view.View
import android.widget.Button
import android.widget.LinearLayout
import android.widget.TextView

class MainActivity : Activity() {
    private lateinit var status: TextView

    override fun onCreate(b: Bundle?) {
        super.onCreate(b)
        val tf = Typeface.createFromAsset(assets, "fonts/farah.otf")
        val pad = (24 * resources.displayMetrics.density).toInt()
        val root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            layoutDirection = View.LAYOUT_DIRECTION_RTL
            setPadding(pad, pad * 2, pad, pad)
        }
        fun text(s: String, size: Float) = TextView(this).apply {
            text = s; textSize = size; typeface = tf; gravity = Gravity.START
            textDirection = View.TEXT_DIRECTION_RTL
            setPadding(0, 0, 0, pad / 2)
        }
        fun btn(s: String, f: () -> Unit) = Button(this).apply {
            text = s; typeface = tf; textSize = 18f; setOnClickListener { f() }
        }
        root.addView(text("قلمي", 36f))
        root.addView(text("سبورة عائمة تظهر فوق تطبيق الملاحظات. تكتب بخط يدك فيُدخل التطبيق النص في الحقل المفتوح.", 18f))
        root.addView(text("1) حمّل نموذج التعرف على الخط العربي (مرة واحدة)", 17f))
        root.addView(btn("تحميل نموذج الخط العربي") { download() })
        status = text("", 16f); root.addView(status)
        root.addView(text("2) فعّل الخدمة من إعدادات إمكانية الوصول ثم اختر «قلمي»", 17f))
        root.addView(btn("فتح إعدادات إمكانية الوصول") {
            startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
        })
        root.addView(text("3) افتح تطبيق الملاحظات واضغط على الحقل. ستظهر فقاعة «ق» اضغطها لفتح السبورة.", 17f))
        setContentView(root)
    }

    private fun download() {
        status.text = "جارٍ التحقق…"
        Recognizer.ensureModel { s ->
            runOnUiThread {
                status.text = when (s) {
                    "ready" -> "النموذج جاهز ✔"
                    "downloading" -> "جارٍ تحميل النموذج، يلزم اتصال بالإنترنت…"
                    else -> "فشل التحميل. تحقق من الإنترنت وأعد المحاولة."
                }
            }
        }
    }
}

